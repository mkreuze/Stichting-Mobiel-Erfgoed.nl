name: Deploy naar TransIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Voorbereiden upload-map
        run: |
          mkdir -p _deploy
          cp index.html nieuws.html nieuws.js _deploy/
          cp -r fotos _deploy/

      - name: Upload via SFTP naar TransIP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './_deploy/*'
          remote_path: ${{ secrets.SFTP_TARGET_DIR }}
          sftp_only: true
          delete_remote_files: false
